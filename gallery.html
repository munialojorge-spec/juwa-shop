<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gallery - Juwa World</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="navbar-container">
        <div class="logo-section">
            <img src="logo.jpeg" alt="Logo" class="logo">
            <h2 class="brand-title">JUWA WORLD</h2>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="shop.html">SHOP</a></li>
            <li><a href="gallery.html" class="active">GALLERY</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
        <div class="nav-icons">
            <i class="fas fa-search" id="searchIcon" style="cursor: pointer;"></i>
            <div style="position:relative;">
                <i class="fas fa-shopping-bag" id="cartIcon" style="cursor: pointer;"></i>
                <span id="cartCount" style="position: absolute; top: -8px; right: -8px; background: var(--gold); color: var(--dark); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; display: none;">0</span>
            </div>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</nav>

<!-- Cart Modal Popup -->
<div id="cartModal" class="cart-modal" style="display: none;">
    <div class="cart-modal-content">
        <div class="cart-modal-header">
            <h3>🛍️ Shopping Cart</h3>
            <button class="close-cart" id="closeCart" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--gold);">&times;</button>
        </div>
        <div id="cartModalItems" class="cart-modal-items"></div>
        <div class="cart-modal-footer">
            <div class="cart-modal-total">
                <strong>Total:</strong> <span id="cartModalTotal">Ksh 0</span>
            </div>
            <a href="checkout.html" class="checkout-btn" style="text-decoration: none; display: block; text-align: center;">Proceed to Checkout</a>
        </div>
    </div>
</div>

<!-- Search Modal Popup -->
<div id="searchModal" class="search-modal" style="display: none;">
    <div class="search-modal-content">
        <div class="search-modal-header" style="display: flex; align-items: center; gap: 10px; padding: 20px; border-bottom: 2px solid var(--gold);">
            <input type="text" id="searchInput" placeholder="Search products..." style="flex: 1; padding: 12px; border: 2px solid var(--gold); border-radius: 8px; font-size: 16px;">
            <button class="close-search" id="closeSearch" style="background: none; border: none; font-size: 28px; cursor: pointer; color: var(--gold); padding: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">&times;</button>
        </div>
        <div id="searchResults" class="search-results" style="padding: 20px;"></div>
    </div>
</div>

<section class="page-hero">

<h1>Our Gallery</h1>

<p>
Latest luxury nail designs and beauty work.
</p>

</section>

<section class="gallery-grid">

<img src="nail.jpeg" alt="Luxury Nail Art" class="tile tile-1">
<img src="nail2.jpeg" alt="Acrylic Design" class="tile tile-2">
<img src="nail3.jpeg" alt="Gel Nails" class="tile tile-3">
<img src="nail4.jpeg" alt="Nail Design" class="tile tile-4">
<img src="nail5.jpeg" alt="Luxury Service" class="tile tile-5">
<img src="nail6.jpeg" alt="Beauty Design" class="tile tile-6">
<img src="nail7.jpeg" alt="Premium Nails" class="tile tile-7">
<img src="nail8.jpeg" alt="Nail Styling" class="tile tile-8">

</section>

<script src="script.js"></script>
</body>
</html>
